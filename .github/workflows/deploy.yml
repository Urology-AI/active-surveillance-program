name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      # Vite bakes every VITE_* value into the client bundle at build time, so anything
      # passed here is PUBLIC. Never pass an API key. The Gemini key lives only in the
      # proxy worker's server-side secret; the client calls the worker by URL.
      # VITE_ASSISTANT_ENDPOINT is a non-secret URL with a default in the source, so it
      # is set here only to point a build at a different proxy.
      - name: Build
        env:
          VITE_ASSISTANT_ENDPOINT: ${{ vars.VITE_ASSISTANT_ENDPOINT }}
        run: npm run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
