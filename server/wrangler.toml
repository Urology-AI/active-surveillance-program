name = "as-assistant-proxy"
main = "assistant-proxy.js"
compatibility_date = "2024-11-01"

# Non-secret config. Comma-separated list of browser origins allowed to call the
# proxy cross-origin. Leave unset/empty when the Worker is routed on the SAME
# origin as the app (recommended) — then no CORS headers are emitted at all.
[vars]
ALLOWED_ORIGIN = ""

# The API key is NEVER placed here. Set it as an encrypted secret:
#   npx wrangler secret put GEMINI_API_KEY
#
# Recommended route so the client can use a same-origin path (/api/assistant):
# [[routes]]
# pattern = "example.org/api/assistant"
# zone_name = "example.org"
